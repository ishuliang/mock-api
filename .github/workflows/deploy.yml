name: 构建mock-api并部署到阿里云服务器

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安装依赖 & 打包
        run: |
          npm ci
          npm run build

      - name: 验证 Secrets 是否配置
        run: |
          echo "SERVER_IP 已设置: ${{ secrets.SERVER_IP != '' }}"
          echo "SERVER_USER 已设置: ${{ secrets.SERVER_USER != '' }}"
          echo "SERVER_PRIVATE_KEY 已设置: ${{ secrets.SERVER_PRIVATE_KEY != '' }}"

      - name: 配置 SSH 私钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: 上传文件到阿里云
        run: |
          scp -r -P 22 dist/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/mock-api/

      - name: 安装依赖（依赖变化时）& 重启服务
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            cd ~/mock-api/dist
            NEW_HASH=$(md5sum package-lock.json | awk '{print $1}')
            OLD_HASH=$(cat .lock_hash 2>/dev/null || echo "")
            if [ "$NEW_HASH" != "$OLD_HASH" ]; then
              echo "依赖有变化，重新安装..."
              npm ci --omit=dev
              echo "$NEW_HASH" > .lock_hash
            else
              echo "依赖无变化，跳过安装"
            fi
            cd ~/mock-api
            pm2 restart mock-api || pm2 start dist/index.js --name mock-api